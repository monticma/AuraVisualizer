<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Edges connecting nodes -->
  <g stroke="currentColor" stroke-width="0.8" opacity="0.6">
    <!-- Center to outer nodes -->
    <line x1="12" y1="11" x2="5" y2="4"/>
    <line x1="12" y1="11" x2="12" y2="3"/>
    <line x1="12" y1="11" x2="19" y2="4"/>
    <line x1="12" y1="11" x2="21" y2="10"/>
    <line x1="12" y1="11" x2="20" y2="17"/>
    <line x1="12" y1="11" x2="14" y2="20"/>
    <line x1="12" y1="11" x2="7" y2="19"/>
    <line x1="12" y1="11" x2="3" y2="14"/>
    <line x1="12" y1="11" x2="3" y2="8"/>
    <!-- Outer ring connections -->
    <line x1="5" y1="4" x2="12" y2="3"/>
    <line x1="12" y1="3" x2="19" y2="4"/>
    <line x1="19" y1="4" x2="21" y2="10"/>
    <line x1="21" y1="10" x2="20" y2="17"/>
    <line x1="20" y1="17" x2="14" y2="20"/>
    <line x1="14" y1="20" x2="7" y2="19"/>
    <line x1="7" y1="19" x2="3" y2="14"/>
    <line x1="3" y1="14" x2="3" y2="8"/>
    <line x1="3" y1="8" x2="5" y2="4"/>
    <!-- Cross connections -->
    <line x1="5" y1="4" x2="19" y2="4"/>
    <line x1="3" y1="8" x2="21" y2="10"/>
    <line x1="3" y1="14" x2="20" y2="17"/>
    <line x1="5" y1="4" x2="3" y2="14"/>
    <line x1="19" y1="4" x2="20" y2="17"/>
    <line x1="7" y1="19" x2="12" y2="3"/>
  </g>
  <!-- Outer nodes -->
  <g fill="currentColor">
    <circle cx="5" cy="4" r="1.3"/>
    <circle cx="12" cy="3" r="1.3"/>
    <circle cx="19" cy="4" r="1.3"/>
    <circle cx="21" cy="10" r="1.3"/>
    <circle cx="20" cy="17" r="1.3"/>
    <circle cx="14" cy="20" r="1.3"/>
    <circle cx="7" cy="19" r="1.3"/>
    <circle cx="3" cy="14" r="1.3"/>
    <circle cx="3" cy="8" r="1.3"/>
  </g>
  <!-- Central hub node (larger) -->
  <circle cx="12" cy="11" r="2.2" fill="currentColor"/>
</svg>
